{
  "name": "版本 / Release",
  "description": "填写目标版本，选择发布阶段与组件版本，记录 Release notes、已知问题和发布结果。",
  "title": "[Release] ",
  "type": "Task",
  "labels": [
    "release"
  ],
  "projects": [
    "Songo-Labs/1"
  ],
  "body": [
    {
      "type": "markdown",
      "attributes": {
        "value": "在实际发布组件的仓库创建版本单。先填写目标版本与发布阶段，再选择本次涉及的组件版本；发布前补齐说明和验收记录，实际发布后关闭。"
      }
    },
    {
      "type": "input",
      "id": "version",
      "attributes": {
        "label": "目标版本",
        "description": "填写本次计划发布的版本号 / build。",
        "placeholder": "完整 Tag，或平台版本号与 build"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "dropdown",
      "id": "channel",
      "attributes": {
        "label": "发布阶段",
        "description": "按本次发布的目标阶段选择。实际接收对象与分发链接记入下方的验收与发布记录。",
        "options": [
          "Dev（开发联调）",
          "Alpha（早期验证）",
          "Beta（测试与试用）",
          "RC（发布候选）",
          "Stable（正式发布）"
        ]
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "markdown",
      "attributes": {
        "value": "### 版本范围\n每个组件选择一个版本；不涉及的保持“不涉及”，版本尚未建立时选“待补充”。发布前确认各组件版本及兼容性。标有“平台未注明”的 App 版本，选择前需确认适用平台。"
      }
    },
