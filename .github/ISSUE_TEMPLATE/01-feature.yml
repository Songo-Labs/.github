name: 需求 / Feature
description: 说清要做什么、具体行为和验收结果。
title: "[需求] "
type: Feature
labels: [enhancement]
projects: [Songo-Labs/1]
body:
  - type: markdown
    attributes:
      value: |
        用直接、自然的语言描述需求，让接手的人能快速理解并开始工作。
        先说要做什么，再说明具体行为。每条信息放在最合适的位置，只写一次。
        限制和异常只写会影响本次实现或验收的内容。
  - type: textarea
    id: summary
    attributes:
      label: 需求概述
      description: 用 1–3 句话说明这次要做什么、用户会看到什么变化。
      placeholder: 这次要做什么，使用时会有什么变化。
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 要解决的问题
      description: 简述当前行为和具体困扰。有实例就用实例说明。
      placeholder: 当前怎样使用，遇到了什么问题。
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 交付的范围和边界（选填）
      description: 列出本次涉及的功能、页面或组件。容易产生误解时，再说明哪些内容留到后续。
      placeholder: 本次涉及的功能、页面或组件。
  - type: textarea
    id: logic
    attributes:
      label: 需求逻辑详情
      description: 按实际使用顺序描述：什么情况下触发、系统怎么响应、最后是什么结果。涉及多种情况时用列表或表格。
      placeholder: "1. 当……时，……\n2. ……"
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: PRD、原型或设计链接（选填）
      description: 提供已有资料链接；没有独立文档时，在本单中把需求说清楚即可。
      placeholder: "PRD / 规格：\n原型 / 设计："
  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      description: 列出本次交付必须满足的关键结果，一条判断一件事。需求中明确涉及异常流程时，补充对应验收项。
      placeholder: "- [ ] 在……条件下，执行……，结果应为……"
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: 依赖与待确认项（选填）
      description: 写清依赖谁、依赖什么，以及仍需决定的问题；没有则留空。
      placeholder: "依赖：\n待确认："
